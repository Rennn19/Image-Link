<!DOCTYPE html>
<html lang="id" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WikiStatic CDN & Source Engine</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            wikia: { 400: '#38bdf8', 500: '#06b6d4', 600: '#0891b2' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); }
  </style>
</head>
<body class="bg-[#070a12] text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-wikia-500 to-indigo-500 flex items-center justify-center font-bold text-slate-950">
          <i class="fa-solid fa-link text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white">Image-Link Engine</h1>
          <p class="text-xs text-slate-400 font-mono">rennn19.github.io/Image-Link</p>
        </div>
      </div>
      <div id="statusBadge" class="text-xs font-mono px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        ● Live Cloud CDN Upload
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto w-full px-4 py-8 flex-1 space-y-6">
    
    <!-- DRAG AND DROP ZONE -->
    <div 
      id="dropZone"
      onclick="document.getElementById('fileInput').click()"
      class="glass-panel border-2 border-dashed border-slate-700 hover:border-wikia-500 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 relative group overflow-hidden"
    >
      <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event)">
      <div class="w-16 h-16 rounded-2xl bg-wikia-500/10 border border-wikia-500/20 text-wikia-400 flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
        <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
      </div>
      <h2 class="text-lg font-bold text-slate-100 mb-1">Seret & Lepaskan Gambar di Sini</h2>
      <p class="text-xs text-slate-400 max-w-sm mx-auto mb-4">File akan otomatis di-upload ke Cloud CDN permanen & langsung menghasilkan link publik.</p>
      <span class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-wikia-500 text-slate-950 font-bold text-xs">
        Pilih Gambar dari Perangkat
      </span>
    </div>

    <!-- PROGRESS INDICATOR -->
    <div id="uploadProgress" class="hidden glass-panel p-4 rounded-xl border border-wikia-500/30 space-y-2">
      <div class="flex justify-between text-xs font-mono">
        <span class="text-wikia-400" id="progressText">Mengunggah ke Cloud CDN...</span>
        <span class="text-slate-400" id="progressPercent">0%</span>
      </div>
      <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-wikia-500 h-full w-0 transition-all duration-200"></div>
      </div>
    </div>

    <!-- GALLERY & GENERATED LINKS LIST -->
    <div class="space-y-4">
      <h3 class="text-sm font-bold font-mono text-slate-400 uppercase tracking-wider">Daftar Link Gambar Publik</h3>
      <div id="linksContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Berkas yang diupload akan muncul di sini -->
      </div>
    </div>

  </main>

  <script>
    const CLIENT_ID = '544726315d04170'; // Client API Key Publik Imgur Cloud Storage

    // Set Drag & Drop Handler
    const dropZone = document.getElementById('dropZone');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    dropZone.addEventListener('dragover', () => dropZone.classList.add('border-wikia-500', 'bg-slate-900/40'));
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-wikia-500', 'bg-slate-900/40'));
    dropZone.addEventListener('drop', (e) => {
      dropZone.classList.remove('border-wikia-500', 'bg-slate-900/40');
      const files = e.dataTransfer.files;
      if (files.length > 0) uploadFiles(files);
    });

    function handleFileSelect(e) {
      if (e.target.files.length > 0) uploadFiles(e.target.files);
    }

    async function uploadFiles(files) {
      const progressContainer = document.getElementById('uploadProgress');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const progressPercent = document.getElementById('progressPercent');

      progressContainer.classList.remove('hidden');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        if (!file.type.startsWith('image/')) continue;

        progressText.textContent = `Mengunggah ${file.name} (${i + 1}/${files.length})...`;
        progressBar.style.width = `50%`;
        progressPercent.textContent = `50%`;

        try {
          const formData = new FormData();
          formData.append('image', file);

          // Upload ke Imgur Cloud API secara gratis & permanen
          const response = await fetch('https://api.imgur.com/3/image', {
            method: 'POST',
            headers: { Authorization: `Client-ID ${CLIENT_ID}` },
            body: formData
          });

          const result = await response.json();

          if (result.success) {
            const publicUrl = result.data.link;
            addLinkCard(file.name, publicUrl);
          } else {
            alert('Gagal mengunggah file: ' + file.name);
          }
        } catch (err) {
          alert('Terjadi kesalahan jaringan saat mengunggah.');
        }
      }

      progressBar.style.width = `100%`;
      progressPercent.textContent = `100%`;
      setTimeout(() => progressContainer.classList.add('hidden'), 1000);
    }

    function addLinkCard(fileName, url) {
      const container = document.getElementById('linksContainer');
      const card = document.createElement('div');
      card.className = 'glass-card p-4 rounded-xl border border-slate-800 space-y-3';
      
      card.innerHTML = `
        <div class="flex items-center gap-3">
          <img src="${url}" class="w-14 h-14 rounded-lg object-cover bg-slate-950 border border-slate-800 shrink-0">
          <div class="overflow-hidden flex-1">
            <h4 class="text-xs font-bold text-slate-200 truncate">${fileName}</h4>
            <span class="text-[10px] font-mono text-emerald-400">● CDN Live Public</span>
          </div>
        </div>
        <div class="space-y-2 text-xs font-mono">
          <div>
            <label class="text-[10px] text-slate-500 block">Direct Image Link (Dapat dibuka di mana saja)</label>
            <div class="flex gap-1 mt-1">
              <input type="text" readonly value="${url}" class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-300 w-full text-[11px]">
              <button onclick="navigator.clipboard.writeText('${url}'); alert('Link berhasil disalin!');" class="px-3 bg-wikia-500 text-slate-950 font-bold rounded hover:bg-wikia-400">Salin</button>
            </div>
          </div>
          <div>
            <label class="text-[10px] text-slate-500 block">HTML Tag (&lt;img&gt;)</label>
            <div class="flex gap-1 mt-1">
              <input type="text" readonly value='<img src="${url}" alt="${fileName}">' class="bg-slate-950 border border-slate-800 rounded px-2 py-1 text-slate-400 w-full text-[10px]">
              <button onclick="navigator.clipboard.writeText('<img src=\\'${url}\\' alt=\\'${fileName}\\'>'); alert('HTML disalin!');" class="px-2 bg-slate-800 text-slate-200 rounded">Salin</button>
            </div>
          </div>
        </div>
      `;
      container.prepend(card);
    }
  </script>
</body>
</html>
